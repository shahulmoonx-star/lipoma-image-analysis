[theme]
base = "light"
primaryColor = "#0B4F8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F9"
textColor = "#1B2733"
linkColor = "#0B4F8A"
borderColor = "#D5DDE6"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
headingFontSizes = ["30px", "22px", "17px", "15px", "14px", "12px"]
headingFontWeights = [650, 650, 650, 600, 600, 600]

redColor = "#B42318"
orangeColor = "#B54708"
yellowColor = "#A16207"
greenColor = "#067647"
blueColor = "#0B4F8A"
violetColor = "#5B3FA6"
grayColor = "#5B6B7B"

chartCategoricalColors = ["#0B4F8A", "#0F8B8D", "#C26A1B", "#5B3FA6", "#B42318", "#6B7C8F"]
chartSequentialColors = ["#EAF2FA", "#D3E4F4", "#B5D0EA", "#8FB6DB", "#6A9ACB", "#487DB8", "#2D63A0", "#1B4D88", "#103B6C", "#0A2A50"]

dataframeHeaderBackgroundColor = "#14304D"
dataframeHeaderTextColor = "#FFFFFF"
dataframeBorderColor = "#D5DDE6"

[theme.sidebar]
backgroundColor = "#0F2438"
secondaryBackgroundColor = "#173553"
textColor = "#E6EDF5"
borderColor = "#27435F"
primaryColor = "#6FB3E8"
linkColor = "#9CCBF0"

[server]
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
